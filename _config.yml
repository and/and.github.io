title: Field Notes
description: "Interactive notes on things I am learning, from algorithms and maths to cooking. Many posts can be read at three levels: beginner, intermediate or expert."
url: "https://and.github.io"

# Theme
theme: minima

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github/

# Permalink structure
permalink: /:year/:month/:day/:title/

# Pagination (optional)
# paginate: 5
# paginate_path: "/page:num/"
