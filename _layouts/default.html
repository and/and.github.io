<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --color-bg: #fffef9;
  --color-text: #0a0a0a;
  --color-text-secondary: #404040;
  --color-text-tertiary: #808080;
  --color-accent: #c2410c;
  --color-border: #e5e5e5;
  --color-subtle: #f5f5f4;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --max-width: 680px;
  --spacing-xs: 0.5rem;
  --spacing-sm: 1rem;
  --spacing-md: 2rem;
  --spacing-lg: 3rem;
  --spacing-xl: 4.5rem;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-body);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.75;
  font-size: 18px;
  font-weight: 300;
  letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

.container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--spacing-md);
}

/* Header */
header.site-header {
  border-bottom: 1px solid var(--color-border);
  padding: var(--spacing-lg) 0;
  background: var(--color-bg);
}

.header-content {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--spacing-md);
}

.site-title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.5rem;
  letter-spacing: -0.02em;
  color: var(--color-text);
  text-decoration: none;
  font-optical-sizing: auto;
  transition: opacity 0.2s ease;
}

.site-title:hover {
  opacity: 0.6;
}

.site-nav {
  display: flex;
  gap: var(--spacing-md);
  font-size: 0.875rem;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  font-weight: 400;
}

.site-nav a {
  color: var(--color-text-tertiary);
  text-decoration: none;
  transition: color 0.2s ease;
  position: relative;
}

.site-nav a:hover {
  color: var(--color-text);
}

.site-nav a::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 0;
  height: 1px;
  background: var(--color-text);
  transition: width 0.2s ease;
}

.site-nav a:hover::after {
  width: 100%;
}

/* Mobile Menu */
.nav-trigger {
  display: none;
}

.menu-icon {
  display: none;
}

/* Hero Section */
.hero {
  padding: var(--spacing-xl) 0 var(--spacing-lg);
  border-bottom: 1px solid var(--color-border);
}

.page-heading {
  font-family: var(--font-display);
  font-size: 4rem;
  font-weight: 300;
  line-height: 1.1;
  margin-bottom: var(--spacing-md);
  letter-spacing: -0.035em;
  font-optical-sizing: auto;
  color: var(--color-text);
}

.page-description {
  font-size: 1.125rem;
  line-height: 1.7;
  color: var(--color-text-secondary);
  max-width: 540px;
  font-weight: 300;
}

/* Posts Section */
.posts-section {
  padding: var(--spacing-xl) 0 var(--spacing-xl);
}

.section-heading, .post-list-heading {
  font-size: 0.75rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--color-text-tertiary);
  margin-bottom: var(--spacing-lg);
  display: block;
}

.post-list {
  list-style: none;
}

.post-list li, .post-item {
  margin-bottom: var(--spacing-lg);
  padding: 0;
  background: transparent;
  border: none;
  transition: opacity 0.2s ease;
}

.post-list li:hover, .post-item:hover {
  opacity: 0.7;
}

.post-list .post-link {
  display: block;
  text-decoration: none;
}

.post-meta {
  font-size: 0.8125rem;
  color: var(--color-text-tertiary);
  margin-bottom: var(--spacing-xs);
  font-weight: 400;
  letter-spacing: 0.01em;
}

.post-list h3 {
  margin: 0;
}

.post-title {
  font-family: var(--font-display);
  font-size: 1.75rem;
  font-weight: 400;
  line-height: 1.3;
  margin: 0;
  color: var(--color-text);
  letter-spacing: -0.025em;
  font-optical-sizing: auto;
}

.post-link {
  color: inherit;
  text-decoration: none;
  display: block;
}

.post-link:hover .post-title,
.post-link:hover h3 {
  color: var(--color-accent);
}

/* Article */
.page-content {
  padding: var(--spacing-xl) 0 var(--spacing-xl);
}

.post-header {
  margin-bottom: var(--spacing-xl);
  padding-bottom: var(--spacing-lg);
  border-bottom: 1px solid var(--color-border);
}

.post-header .post-title {
  font-family: var(--font-display);
  font-size: 3.5rem;
  font-weight: 300;
  line-height: 1.1;
  margin-bottom: var(--spacing-md);
  letter-spacing: -0.035em;
  font-optical-sizing: auto;
}

.post-header .post-meta {
  font-size: 0.875rem;
  color: var(--color-text-tertiary);
  font-weight: 400;
  letter-spacing: 0.01em;
}

.post-content {
  max-width: 620px;
  line-height: 1.75;
}

.post-content p {
  margin-bottom: var(--spacing-md);
}

.post-content h2 {
  font-family: var(--font-display);
  font-size: 2.25rem;
  font-weight: 400;
  margin-top: var(--spacing-xl);
  margin-bottom: var(--spacing-md);
  letter-spacing: -0.03em;
  font-optical-sizing: auto;
  line-height: 1.2;
}

.post-content h3 {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 400;
  margin-top: var(--spacing-lg);
  margin-bottom: var(--spacing-sm);
  letter-spacing: -0.02em;
  font-optical-sizing: auto;
  line-height: 1.3;
}

/* Code Blocks */
pre,
code {
  font-family: 'Berkeley Mono', 'IBM Plex Mono', 'Fira Code', Menlo, monospace;
  font-size: 0.875em;
  font-variant-ligatures: common-ligatures;
  -webkit-font-smoothing: subpixel-antialiased;
  -moz-osx-font-smoothing: auto;
}

code {
  padding: 0.125rem 0.375rem;
  background: var(--color-subtle);
  color: var(--color-text-secondary);
  border-radius: 2px;
  font-weight: 400;
  letter-spacing: -0.01em;
}

pre {
  padding: var(--spacing-md);
  background: var(--color-subtle);
  border: 1px solid var(--color-border);
  border-left: 2px solid var(--color-text);
  overflow-x: auto;
  line-height: 1.6;
  margin: var(--spacing-lg) 0;
  border-radius: 0;
}

pre code {
  padding: 0;
  background: transparent;
  border: none;
  font-size: 0.9375em;
  color: var(--color-text);
  font-weight: 400;
  letter-spacing: 0;
}

/* Syntax Highlighting */
.highlight {
  background: transparent;
  border-radius: 0;
}

.highlighter-rouge .highlight {
  background: var(--color-subtle);
  border: 1px solid var(--color-border);
  border-radius: 2px;
}

/* Rouge/Pygments Syntax Token Colors - Minimal Refined Palette */
.highlight .c { color: var(--color-text-tertiary); font-style: italic; } /* Comment */
.highlight .err { color: #991b1b; } /* Error */
.highlight .k { color: var(--color-accent); font-weight: 500; } /* Keyword */
.highlight .o { color: var(--color-text-secondary); } /* Operator */
.highlight .cm, .highlight .cp, .highlight .c1, .highlight .cs { color: var(--color-text-tertiary); font-style: italic; }
.highlight .ge { font-style: italic; }
.highlight .gs { font-weight: 500; }
.highlight .kc, .highlight .kd, .highlight .kp, .highlight .kr { color: var(--color-accent); font-weight: 500; }
.highlight .kt { color: #1e40af; font-weight: 500; }
.highlight .m, .highlight .mf, .highlight .mh, .highlight .mi, .highlight .mo, .highlight .il { color: #15803d; }
.highlight .s, .highlight .sb, .highlight .sc, .highlight .s2, .highlight .sh, .highlight .sx, .highlight .s1 { color: #7c2d12; }
.highlight .sd { color: var(--color-text-tertiary); font-style: italic; }
.highlight .se, .highlight .si { color: var(--color-accent); }
.highlight .sr { color: #15803d; }
.highlight .ss { color: #7c2d12; }
.highlight .na, .highlight .ne, .highlight .nf { color: var(--color-accent); }
.highlight .nb { color: #1e40af; }
.highlight .nc { color: #1e40af; font-weight: 500; }
.highlight .no, .highlight .nv, .highlight .vc, .highlight .vg, .highlight .vi { color: #15803d; }
.highlight .nt { color: #1e40af; }
.highlight .ow { color: var(--color-accent); }
.highlight .err, .highlight .gr, .highlight .gt { color: #991b1b; }

/* Page (About) */
.post .post-title {
  font-size: 3.5rem;
  font-weight: 300;
  line-height: 1.2;
  margin-bottom: 2rem;
  letter-spacing: -0.03em;
}

/* Footer */
.site-footer {
  border-top: 1px solid var(--color-border);
  padding: var(--spacing-xl) 0 var(--spacing-lg);
  margin-top: var(--spacing-xl);
  background: var(--color-bg);
}

.footer-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--spacing-md);
  font-size: 0.8125rem;
  color: var(--color-text-tertiary);
  font-weight: 400;
  letter-spacing: 0.01em;
}

.rss-link, .rss-subscribe a {
  color: var(--color-text);
  text-decoration: none;
  font-weight: 400;
  transition: opacity 0.2s ease;
  position: relative;
}

.rss-link:hover, .rss-subscribe a:hover {
  opacity: 0.6;
}

.rss-subscribe {
  font-size: 0.8125rem;
  color: var(--color-text-tertiary);
  margin-top: var(--spacing-lg);
  font-weight: 400;
  letter-spacing: 0.01em;
}

/* Pinned posts */
.post-list-pinned {
  margin-bottom: var(--spacing-xl);
}

.post-item-pinned {
  background: transparent;
  border: none;
  padding: 0;
  margin-bottom: var(--spacing-lg);
  transition: opacity 0.2s ease;
}

.post-item-pinned:hover {
  opacity: 0.7;
}

.pinned-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--spacing-xs);
}

.label {
  font-size: 0.6875rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 0.25rem 0.5rem;
  border-radius: 2px;
}

.label-blue {
  background: var(--color-accent);
  color: white;
}

.pinned-card-excerpt {
  margin-top: var(--spacing-sm);
  color: var(--color-text-secondary);
  font-size: 1rem;
  line-height: 1.6;
  font-weight: 300;
}

/* Mobile Responsive */
@media (max-width: 768px) {
  :root {
    --spacing-xs: 0.375rem;
    --spacing-sm: 0.75rem;
    --spacing-md: 1.5rem;
    --spacing-lg: 2rem;
    --spacing-xl: 3rem;
  }

  body {
    font-size: 17px;
  }

  .site-nav {
    display: none;
  }

  .menu-icon {
    display: block;
    cursor: pointer;
    padding: var(--spacing-xs);
  }

  .nav-trigger:checked ~ .site-nav {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--color-bg);
    border-bottom: 1px solid var(--color-border);
    padding: var(--spacing-md);
    gap: var(--spacing-md);
  }

  .header-content {
    position: relative;
  }

  .page-heading {
    font-size: 2.5rem;
  }

  .hero {
    padding: var(--spacing-xl) 0 var(--spacing-lg);
  }

  .post-list li, .post-item, .post-item-pinned {
    padding: 0;
    margin-bottom: var(--spacing-lg);
  }

  .post-title {
    font-size: 1.5rem;
  }

  .post-header .post-title {
    font-size: 2.5rem;
  }

  .post .post-title {
    font-size: 2.5rem;
  }

  .post-content h2 {
    font-size: 1.75rem;
  }

  .post-content h3 {
    font-size: 1.25rem;
  }

  .footer-content {
    flex-direction: column;
    gap: var(--spacing-sm);
    text-align: center;
  }
}

@media (max-width: 480px) {
  :root {
    --spacing-xl: 2.5rem;
    --spacing-lg: 1.5rem;
  }

  body {
    font-size: 16px;
  }

  .page-heading {
    font-size: 2rem;
  }

  .post-title {
    font-size: 1.25rem;
  }

  .post-header .post-title {
    font-size: 2rem;
  }

  .post .post-title {
    font-size: 2rem;
  }

  .post-content h2 {
    font-size: 1.5rem;
  }

  .post-content h3 {
    font-size: 1.125rem;
  }
}
</style>
<link type="application/atom+xml" rel="alternate" href="{{ "/feed.xml" | relative_url }}" title="{{ site.title | escape }}" />
</head>
<body>
<header class="site-header" role="banner">
  <div class="header-content">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
    <input type="checkbox" id="nav-trigger" class="nav-trigger" />
    <label for="nav-trigger">
      <span class="menu-icon">
        <svg viewBox="0 0 18 15" width="18px" height="15px">
          <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516L18,13.516z"/>
        </svg>
      </span>
    </label>
    <nav class="site-nav">
      <a href="{{ "/about/" | relative_url }}">About</a>
      <a href="{{ "/" | relative_url }}">What's new</a>
    </nav>
  </div>
</header>
<main class="page-content" aria-label="Content">
  <div class="container">
    {{ content }}
  </div>
</main>
<footer class="site-footer">
  <div class="footer-content">
    <div>Blog powered by GitHub Issues</div>
    <a href="{{ "/feed.xml" | relative_url }}" class="rss-link">Subscribe via RSS</a>
  </div>
</footer>
</body>
</html>
