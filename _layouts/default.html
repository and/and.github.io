<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--text:#111111;--muted:#6b6b6b;--faint:#9a9a9a;--rule:#e8e8e8;--subtle:#f6f6f6;--mark:#ffe14d;
  --font:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
  --max-width:640px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
.container{max-width:var(--max-width);margin:0 auto;padding:0 20px}

header.site-header{padding:28px 0 0}
.header-content{display:flex;justify-content:space-between;align-items:baseline;max-width:var(--max-width);margin:0 auto;padding:0 20px 14px;border-bottom:1px solid var(--text)}
.site-title{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--text);text-decoration:none}
.site-title:hover{color:var(--muted)}
.site-nav{display:flex;gap:20px;font-family:var(--mono);font-size:13px}
.site-nav a{color:var(--muted);text-decoration:none}
.site-nav a:hover{color:var(--text)}
.nav-trigger,.menu-icon{display:none}

.hero{padding:48px 0 8px}
.page-heading{font-size:30px;font-weight:600;line-height:1.2;letter-spacing:-.02em;margin-bottom:10px}
.page-description{font-size:17px;color:var(--muted);max-width:520px}

.posts-section{padding:32px 0 8px}
.section-heading,.post-list-heading{display:block;font-family:var(--mono);font-size:12px;font-weight:400;color:var(--faint);margin:0 0 8px}
.post-list{list-style:none;margin-bottom:32px}
.post-list li,.post-item{padding:10px 0;border-bottom:1px solid var(--rule)}
.post-list .post-link{display:flex;align-items:baseline;gap:20px;text-decoration:none}
.post-meta{font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap;flex-shrink:0;min-width:96px;font-variant-numeric:tabular-nums}
.post-list h3{flex:1;margin:0}
.post-title{font-size:17px;font-weight:400;line-height:1.45;color:var(--text)}
.post-link{color:inherit;text-decoration:none;display:block}
.post-link:hover .post-title{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.more-posts{margin-top:12px}
.more-link{font-family:var(--mono);font-size:13px;color:var(--muted)}

.page-content{padding:40px 0}
.post-header{margin-bottom:32px}
.post-header .post-title,.post .post-title{font-size:34px;font-weight:600;line-height:1.15;letter-spacing:-.025em;margin-bottom:10px}
.post-header .post-meta{font-size:12px}
.post-content{max-width:640px}
.post-content p,.post-content ul,.post-content ol{margin-bottom:18px}
.post-content ul,.post-content ol{padding-left:1.2em}
.post-content h2{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin:40px 0 10px}
.post-content h3{font-size:18px;font-weight:600;line-height:1.35;margin:28px 0 8px}
.post-content a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.post-content a:hover{background:var(--mark)}
.post-content img{max-width:100%;height:auto}
.post-content blockquote{border-left:2px solid var(--text);padding-left:16px;color:var(--muted);margin-bottom:18px}

pre,code{font-family:var(--mono);font-size:.88em}
code{padding:.1em .3em;background:var(--subtle)}
pre{padding:16px;background:var(--subtle);overflow-x:auto;line-height:1.6;margin:24px 0}
pre code{padding:0;background:transparent;font-size:1em}
.highlight,.highlighter-rouge .highlight{background:var(--subtle)}
.highlight .c,.highlight .cm,.highlight .cp,.highlight .c1,.highlight .cs,.highlight .sd{color:var(--faint);font-style:italic}
.highlight .k,.highlight .kc,.highlight .kd,.highlight .kp,.highlight .kr,.highlight .ow{font-weight:600}
.highlight .s,.highlight .sb,.highlight .sc,.highlight .s2,.highlight .sh,.highlight .sx,.highlight .s1,.highlight .ss{color:#555}
.highlight .err,.highlight .gr,.highlight .gt{color:#b00020}

.site-footer{margin-top:24px}
.footer-content{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:var(--max-width);margin:0 auto;padding:14px 20px 40px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:12px;color:var(--faint)}
.rss-link,.rss-subscribe a{color:var(--muted)}
.rss-subscribe{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:8px}

.post-list-pinned{margin-bottom:32px}
.post-item-pinned{padding:12px 0;border-bottom:1px solid var(--rule)}
.pinned-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.label{font-family:var(--mono);font-size:11px;padding:1px 6px}
.label-blue{background:var(--mark);color:var(--text)}
.pinned-card-excerpt{margin-top:6px;color:var(--muted);font-size:15px;line-height:1.6}

@media (max-width:600px){
  body{font-size:16px}
  .post-list .post-link{flex-direction:column;gap:2px}
  .post-header .post-title,.post .post-title{font-size:28px}
  .page-heading{font-size:26px}
  .footer-content{flex-direction:column;align-items:flex-start}
}
</style>
<link type="application/atom+xml" rel="alternate" href="{{ "/feed.xml" | relative_url }}" title="{{ site.title | escape }}" />
</head>
<body>
<header class="site-header" role="banner">
  <div class="header-content">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
    <input type="checkbox" id="nav-trigger" class="nav-trigger" />
    <label for="nav-trigger">
      <span class="menu-icon">
        <svg viewBox="0 0 18 15" width="18px" height="15px">
          <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.032C17.335,0,18,0.665,18,1.484L18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516L18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484 C0.665,15,0,14.335,0,13.516l0,0c0-0.82,0.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516L18,13.516z"/>
        </svg>
      </span>
    </label>
    <nav class="site-nav">
      <a href="{{ "/about/" | relative_url }}">About</a>
      <a href="{{ "/" | relative_url }}">What's new</a>
    </nav>
  </div>
</header>
<main class="page-content" aria-label="Content">
  <div class="container">
    {{ content }}
  </div>
</main>
<footer class="site-footer">
  <div class="footer-content">
    <div>Blog powered by GitHub Issues</div>
    <a href="{{ "/feed.xml" | relative_url }}" class="rss-link">Subscribe via RSS</a>
  </div>
</footer>
</body>
</html>
