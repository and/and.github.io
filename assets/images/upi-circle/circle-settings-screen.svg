<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="An example UPI Circle screen listing three people, each with their delegation type and how much of their monthly limit they have used" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="600" height="560" fill="#f4f1ea"/>
<ellipse cx="300" cy="540" rx="150" ry="10" fill="#000" opacity=".08"/>
<rect x="155" y="18" width="290" height="514" rx="36" fill="#2b2f36"/>
<rect x="169" y="42" width="262" height="466" rx="18" fill="#ffffff"/>
<rect x="265" y="28" width="70" height="8" rx="4" fill="#454b55"/>

<text x="187" y="80" font-size="20" font-weight="700" fill="#2b2f36">UPI Circle</text>
<text x="187" y="100" font-size="12" fill="#5b6270">3 of 5 people added</text>

<!-- member 1 -->
<g transform="translate(0 120)">
  <rect x="181" y="0" width="238" height="92" rx="12" fill="#f3f7f3"/>
  <circle cx="207" cy="26" r="15" fill="#3a8f4f"/><text x="207" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">A</text>
  <text x="230" y="24" font-size="14" font-weight="600" fill="#2b2f36">Amma</text>
  <text x="230" y="40" font-size="11" fill="#3a8f4f">Full delegation</text>
  <text x="193" y="64" font-size="11" fill="#5b6270">₹6,200 of ₹15,000 this month</text>
  <rect x="193" y="72" width="214" height="8" rx="4" fill="#dfe6df"/>
  <rect x="193" y="72" width="88" height="8" rx="4" fill="#3a8f4f"/>
</g>

<!-- member 2 -->
<g transform="translate(0 222)">
  <rect x="181" y="0" width="238" height="92" rx="12" fill="#f3f7f3"/>
  <circle cx="207" cy="26" r="15" fill="#c98a3b"/><text x="207" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">R</text>
  <text x="230" y="24" font-size="14" font-weight="600" fill="#2b2f36">Ravi (driver)</text>
  <text x="230" y="40" font-size="11" fill="#3a8f4f">Full delegation</text>
  <text x="193" y="64" font-size="11" fill="#5b6270">₹11,800 of ₹15,000 this month</text>
  <rect x="193" y="72" width="214" height="8" rx="4" fill="#dfe6df"/>
  <rect x="193" y="72" width="168" height="8" rx="4" fill="#c98a3b"/>
</g>

<!-- member 3 -->
<g transform="translate(0 324)">
  <rect x="181" y="0" width="238" height="78" rx="12" fill="#f0f4fa"/>
  <circle cx="207" cy="26" r="15" fill="#2f6db5"/><text x="207" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">M</text>
  <text x="230" y="24" font-size="14" font-weight="600" fill="#2b2f36">Meera</text>
  <text x="230" y="40" font-size="11" fill="#2f6db5">Partial delegation</text>
  <text x="193" y="64" font-size="11" fill="#5b6270">You approve each payment</text>
</g>

<!-- add button -->
<rect x="181" y="420" width="238" height="44" rx="22" fill="#2f6db5"/>
<text x="300" y="447" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">+ Add family or friends</text>
<text x="300" y="488" text-anchor="middle" font-size="10" fill="#5b6270">Example screen, not from a real app</text>
</svg>
