<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="One bank account linked to your phone, which is linked to up to five other people's phones" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <g id="ph">
    <rect x="-20" y="-34" width="40" height="68" rx="8" fill="#2b2f36"/>
    <rect x="-16" y="-27" width="32" height="52" rx="3" fill="#e8f0fa"/>
    <circle cx="0" cy="29.5" r="2" fill="#5b6270"/>
  </g>
</defs>
<rect width="720" height="440" fill="#f4f1ea"/>

<!-- bank -->
<g transform="translate(95 210)">
  <polygon points="-62,-40 0,-78 62,-40" fill="#2f6db5"/>
  <rect x="-58" y="-40" width="116" height="10" fill="#2f6db5"/>
  <g fill="#5d8fcc"><rect x="-48" y="-26" width="14" height="56"/><rect x="-21" y="-26" width="14" height="56"/><rect x="7" y="-26" width="14" height="56"/><rect x="34" y="-26" width="14" height="56"/></g>
  <rect x="-62" y="30" width="124" height="12" fill="#2f6db5"/>
  <text x="0" y="-48" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">₹</text>
  <text x="0" y="70" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2f36">Your bank account</text>
</g>

<!-- bank to primary -->
<line x1="165" y1="210" x2="238" y2="210" stroke="#2f6db5" stroke-width="5" stroke-linecap="round"/>

<!-- primary phone -->
<g transform="translate(300 210)">
  <rect x="-55" y="-100" width="110" height="190" rx="18" fill="#2b2f36"/>
  <rect x="-46" y="-84" width="92" height="150" rx="6" fill="#e8f0fa"/>
  <circle cx="0" cy="78" r="5" fill="#5b6270"/>
  <rect x="-30" y="-30" width="60" height="40" rx="7" fill="#2f6db5"/>
  <path d="M-16 -30 v-10 a16 16 0 0 1 32 0 v10" fill="none" stroke="#2f6db5" stroke-width="6"/>
  <circle cx="0" cy="-13" r="5" fill="#fff"/><rect x="-2" y="-12" width="4" height="12" fill="#fff"/>
  <text x="0" y="36" text-anchor="middle" font-size="11" font-weight="600" fill="#2b2f36">UPI PIN</text>
  <text x="0" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#2b2f36">stays here</text>
  <text x="0" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2f36">You</text>
  <text x="0" y="141" text-anchor="middle" font-size="13" fill="#5b6270">primary user</text>
</g>

<!-- links to secondary phones -->
<g fill="none" stroke="#3a8f4f" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round">
  <path d="M358 190 C 440 190, 460 56, 528 56"/>
  <path d="M358 200 C 440 200, 460 133, 528 133"/>
  <path d="M358 210 L 528 210"/>
  <path d="M358 220 C 440 220, 460 287, 528 287"/>
  <path d="M358 230 C 440 230, 460 364, 528 364"/>
</g>

<!-- secondary phones -->
<g>
  <use href="#ph" transform="translate(555 56) scale(.95)"/>
  <use href="#ph" transform="translate(555 133) scale(.95)"/>
  <use href="#ph" transform="translate(555 210) scale(.95)"/>
  <use href="#ph" transform="translate(555 287) scale(.95)"/>
  <use href="#ph" transform="translate(555 364) scale(.95)"/>
</g>
<g font-size="15" fill="#2b2f36">
  <text x="588" y="61">Child</text>
  <text x="588" y="138">Parent</text>
  <text x="588" y="215">Driver</text>
  <text x="588" y="292">House help</text>
  <text x="588" y="369">Your 2nd phone</text>
</g>
<text x="445" y="428" text-anchor="middle" font-size="13" fill="#3a8f4f" font-weight="600">Up to 5 secondary users, no bank account needed</text>
</svg>
